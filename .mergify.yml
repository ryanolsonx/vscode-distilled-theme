queue_rules:
  - name: default
    merge_method: squash
    update_method: rebase
    update_bot_account: "{{ author }}"
    queue_conditions:
      - base=main
      - -conflict

pull_request_rules:
  - name: Automatic merge on approval
    conditions:
      - base=main
      - label=automerge
    actions:
      queue:
        name: default
